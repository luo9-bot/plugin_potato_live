[package]
name = "plugin_potato_live"
version = "0.1.0"
edition = "2024"
description = "bilibili直播检测: 土豆，今天直播了没?"

[package.metadata]
tags = ["potato", "bilibili"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
luo9_sdk = "0.6.0"
once_cell = "1.21.4"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
serde_json = "1.0"
serde = "1.0.228"
serde_yaml = "0.9.34"
tracing = "0.1.44"
chrono = { version = "0.4", features = ["serde"] }